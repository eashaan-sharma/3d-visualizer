<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F1 Scene Graph Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- The import map lets modules write `import * as THREE from 'three'` while the files live in /lib. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./lib/three/three.module.js",
        "three/addons/": "./lib/three/addons/",
        "lil-gui": "./lib/lil-gui/lil-gui.esm.js"
      }
    }
  </script>
</head>
<body>
  <div id="viewport"></div>
  <canvas id="arcball-overlay"></canvas>
  <header id="title">
    <h1>F1 Scene Graph Visualizer</h1>
    <p>Scene graphs · forward kinematics · arcball · .obj</p>
  </header>
  <aside id="tree-panel" class="panel ui">
    <div class="panel-title">Scene graph <span class="hint">click a part</span></div>
    <div class="tree-body"></div>
  </aside>
  <aside id="matrix-panel" class="panel ui"></aside>
  <div id="model-info" class="panel ui" hidden></div>
  <section id="tour" class="panel" hidden></section>
  <aside id="legend" class="panel ui">
    <div class="panel-title">Shortcuts</div>
    <dl class="legend-body">
      <dt>R</dt><dd>Reset all</dd>
      <dt>P</dt><dd>Pit stop</dd>
      <dt>D</dt><dd>Drive</dd>
      <dt>A</dt><dd>Auto-rotate</dd>
      <dt>T</dt><dd>Tour (← → Esc)</dd>
      <dt>H</dt><dd>Hide UI</dd>
      <dt>1–5</dt><dd class="wide">Front · Side · Top · Rear ¾ · Cockpit</dd>
      <dt>Mouse</dt><dd class="wide">Drag rotate · Right-drag pan · Scroll zoom · Click select</dd>
    </dl>
  </aside>
  <script type="module" src="js/main.js"></script>
</body>
</html>
